# Solo para servidores SIN Traefik. Levanta un Traefik con HTTPS automático
# (Let's Encrypt) y redirección HTTP -> HTTPS. Después usa docker-compose.yml normal.
#
#   docker network create traefik
#   docker compose -f docker-compose.traefik.yml up -d
#   docker compose up -d
services:
  traefik:
    image: traefik:v3.1
    container_name: traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?Define ACME_EMAIL en .env}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - traefik

volumes:
  letsencrypt:

networks:
  traefik:
    name: ${TRAEFIK_NETWORK:-traefik}
    external: true
