add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://*.rbxcdn.com; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; frame-src 'self' https://www.youtube-nocookie.com https://www.tiktok.com; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
