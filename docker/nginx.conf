server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json application/xml;

    include /etc/nginx/snippets/security-headers.conf;

    # Salud para Docker / Traefik
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Fuentes e imágenes: caché larga
    location ~* \.(?:woff2|webp|png|jpg|jpeg|ico|svg)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # CSS y JS: caché de una semana
    location ~* \.(?:css|js)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # HTML siempre revalidado para que los cambios se vean al instante
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /index.html;
}
