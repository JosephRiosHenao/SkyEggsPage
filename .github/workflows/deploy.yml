name: Construir y desplegar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Construir imagen
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Revisar que no queden enlaces rotos a archivos locales
        run: |
          missing=0
          for ref in $(grep -oE '"?/[A-Za-z0-9_./-]+\.(webp|png|jpg|ico|css|js|woff2|webmanifest)' site/index.html | tr -d '"' | sort -u); do
            if [ ! -f "site${ref}" ]; then echo "Falta: site${ref}"; missing=1; fi
          done
          exit $missing

      - name: Nombre de la imagen (en minúsculas)
        id: meta
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir (y publicar en main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            SITE_URL=${{ vars.SITE_URL || 'https://skyeggs.pro' }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Probar la API
        working-directory: api
        run: npm test

      - name: Construir la API (y publicar en main)
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.image }}-api:latest
            ${{ steps.meta.outputs.image }}-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  deploy:
    name: Desplegar en el servidor
    needs: build
    if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Actualizar contenedor por SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/skyeggspage' }}
          IMAGE: ${{ needs.build.outputs.image }}:latest
          API_IMAGE: ${{ needs.build.outputs.image }}-api:latest
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: DEPLOY_PATH,IMAGE,API_IMAGE,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd "$DEPLOY_PATH"
            git pull --ff-only
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            IMAGE="$IMAGE" docker compose pull skyeggs-web
            IMAGE="$IMAGE" docker compose up -d --no-build skyeggs-web
            # La API solo se levanta cuando el .env ya tiene GAME_KEY y ADMIN_PASSWORD_HASH
            if grep -Eq '^GAME_KEY=.{32,}' .env && grep -Eq '^ADMIN_PASSWORD_HASH=scrypt:' .env; then
              API_IMAGE="$API_IMAGE" docker compose pull skyeggs-api
              API_IMAGE="$API_IMAGE" docker compose up -d --no-build skyeggs-api
              API_ON=1
            else
              echo "AVISO: falta GAME_KEY o ADMIN_PASSWORD_HASH en .env; la API no se levantó (ver DEPLOY.md)"
            fi
            docker logout ghcr.io
            docker image prune -f
            ok=0
            for i in $(seq 1 15); do
              if docker exec skyeggs-web wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1; then ok=1; echo "Sitio arriba"; break; fi
              sleep 2
            done
            [ "$ok" = 1 ] || { echo "El sitio no respondió a /healthz"; docker logs --tail 50 skyeggs-web; exit 1; }
            if [ "${API_ON:-0}" = 1 ]; then
              for i in $(seq 1 15); do
                if docker exec skyeggs-api wget -qO- http://127.0.0.1:8080/api/health >/dev/null 2>&1; then echo "API arriba"; exit 0; fi
                sleep 2
              done
              echo "La API no respondió"; docker logs --tail 50 skyeggs-api; exit 1
            fi
