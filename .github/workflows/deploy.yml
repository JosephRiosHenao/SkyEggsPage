name: Construir y desplegar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Construir imagen
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Revisar que no queden enlaces rotos a archivos locales
        run: |
          missing=0
          for ref in $(grep -oE '"?/[A-Za-z0-9_./-]+\.(webp|png|jpg|ico|css|js|woff2|webmanifest)' site/index.html | tr -d '"' | sort -u); do
            if [ ! -f "site${ref}" ]; then echo "Falta: site${ref}"; missing=1; fi
          done
          exit $missing

      - name: Nombre de la imagen (en minúsculas)
        id: meta
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir (y publicar en main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            SITE_URL=${{ vars.SITE_URL || 'https://skyeggs.pro' }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Desplegar en el servidor
    needs: build
    if: github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Actualizar contenedor por SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/skyeggspage' }}
          IMAGE: ${{ needs.build.outputs.image }}:latest
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: DEPLOY_PATH,IMAGE,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd "$DEPLOY_PATH"
            git pull --ff-only
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            IMAGE="$IMAGE" docker compose pull skyeggs-web
            IMAGE="$IMAGE" docker compose up -d --no-build --remove-orphans skyeggs-web
            docker logout ghcr.io
            docker image prune -f
            for i in $(seq 1 15); do
              if docker exec skyeggs-web wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1; then
                echo "Sitio arriba"; exit 0
              fi
              sleep 2
            done
            echo "El contenedor no respondió a /healthz"; docker logs --tail 50 skyeggs-web; exit 1
