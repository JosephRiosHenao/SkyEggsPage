# Sky Eggs detrás de un Traefik que ya corre en el servidor.
# Uso: cp .env.example .env && docker compose up -d
services:
  skyeggs-web:
    image: ${IMAGE:-ghcr.io/josephrioshenao/skyeggspage:latest}
    build:
      context: .
      args:
        SITE_URL: https://${DOMAIN:?Define DOMAIN en .env}
    container_name: skyeggs-web
    restart: unless-stopped
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      # Dominio principal
      - traefik.http.routers.skyeggs.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.skyeggs.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.skyeggs.tls=true
      - traefik.http.routers.skyeggs.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.skyeggs.middlewares=skyeggs-compress
      - traefik.http.services.skyeggs.loadbalancer.server.port=80
      - traefik.http.middlewares.skyeggs-compress.compress=true
      # www -> dominio principal (301)
      - traefik.http.routers.skyeggs-www.rule=Host(`www.${DOMAIN}`)
      - traefik.http.routers.skyeggs-www.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.skyeggs-www.tls=true
      - traefik.http.routers.skyeggs-www.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.skyeggs-www.middlewares=skyeggs-www-redirect
      - traefik.http.middlewares.skyeggs-www-redirect.redirectregex.regex=^https?://www\.(.*)
      - traefik.http.middlewares.skyeggs-www-redirect.redirectregex.replacement=https://$${1}
      - traefik.http.middlewares.skyeggs-www-redirect.redirectregex.permanent=true

networks:
  traefik:
    name: ${TRAEFIK_NETWORK:-traefik}
    external: true
