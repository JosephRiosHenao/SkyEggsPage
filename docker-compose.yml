# Sky Eggs detrás de un Traefik que ya corre en el servidor.
# Uso: cp .env.example .env && docker compose up -d
services:
  skyeggs-web:
    image: ${IMAGE:-ghcr.io/josephrioshenao/skyeggspage:latest}
    build:
      context: .
      args:
        SITE_URL: https://${DOMAIN:-skyeggs.pro}
    container_name: skyeggs-web
    restart: unless-stopped
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      # Dominio principal
      - traefik.http.routers.skyeggs.rule=Host(`${DOMAIN:-skyeggs.pro}`)
      - traefik.http.routers.skyeggs.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.skyeggs.tls=true
      - traefik.http.routers.skyeggs.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.skyeggs.middlewares=skyeggs-compress
      - traefik.http.services.skyeggs.loadbalancer.server.port=80
      - traefik.http.middlewares.skyeggs-compress.compress=true
      # www y dominio alterno -> dominio principal (301)
      - traefik.http.routers.skyeggs-redirect.rule=Host(`www.${DOMAIN:-skyeggs.pro}`) || Host(`${ALT_DOMAIN:-huevosdelcielo.pro}`) || Host(`www.${ALT_DOMAIN:-huevosdelcielo.pro}`)
      - traefik.http.routers.skyeggs-redirect.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.skyeggs-redirect.tls=true
      - traefik.http.routers.skyeggs-redirect.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.routers.skyeggs-redirect.middlewares=skyeggs-to-main
      - traefik.http.middlewares.skyeggs-to-main.redirectregex.regex=^https?://[^/]+(.*)
      - traefik.http.middlewares.skyeggs-to-main.redirectregex.replacement=https://${DOMAIN:-skyeggs.pro}$${1}
      - traefik.http.middlewares.skyeggs-to-main.redirectregex.permanent=true

  # API de Prueba tu suerte (sorteo, premios al juego, códigos y panel /admin)
  skyeggs-api:
    image: ${API_IMAGE:-ghcr.io/josephrioshenao/skyeggspage-api:latest}
    build:
      context: ./api
    container_name: skyeggs-api
    restart: unless-stopped
    environment:
      GAME_KEY: ${GAME_KEY:-}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      MAX_MYTHIC_PER_DAY: ${MAX_MYTHIC_PER_DAY:-5}
      MAX_LEGENDARY_PER_DAY: ${MAX_LEGENDARY_PER_DAY:-5}
      MIN_LEVEL: ${MIN_LEVEL:-10}
      CODE_TTL_HOURS: ${CODE_TTL_HOURS:-72}
      SITE_URL: https://${DOMAIN:-skyeggs.pro}
      # Programa de creadores: login con Discord (ver DEPLOY.md §7)
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      DISCORD_ROLE_ADMIN: ${DISCORD_ROLE_ADMIN:-1560889139375898775}
      DISCORD_ROLE_MODERATOR: ${DISCORD_ROLE_MODERATOR:-1563742282392543312}
      DISCORD_ROLE_CREATOR: ${DISCORD_ROLE_CREATOR:-1561051688125730897}
      CLAIM_GRACE_DAYS_WEEK: ${CLAIM_GRACE_DAYS_WEEK:-3}
      CLAIM_GRACE_DAYS_MONTH: ${CLAIM_GRACE_DAYS_MONTH:-5}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_ROLE_CREATOR_ACTIVE: ${DISCORD_ROLE_CREATOR_ACTIVE:-}
      DISCORD_ROLE_CREATOR_VIRAL: ${DISCORD_ROLE_CREATOR_VIRAL:-}
      DISCORD_ROLE_CREATOR_STAR: ${DISCORD_ROLE_CREATOR_STAR:-}
      DISCORD_ROLE_CREATOR_ELITE: ${DISCORD_ROLE_CREATOR_ELITE:-}
      CREATOR_AUTO_TIERS: ${CREATOR_AUTO_TIERS:-true}
      CREATOR_WARN_DAYS_BEFORE: ${CREATOR_WARN_DAYS_BEFORE:-3}
      CREATOR_DEMOTION_GRACE_HOURS: ${CREATOR_DEMOTION_GRACE_HOURS:-24}
      LEGACY_NOTICE_DAYS: ${LEGACY_NOTICE_DAYS:-3}
      LEGACY_DEADLINE: ${LEGACY_DEADLINE:-2027-01-01}
      # Programa de staff (Helper → Moderator Jr → Moderator)
      DISCORD_ANNOUNCE_CHANNEL: ${DISCORD_ANNOUNCE_CHANNEL:-1565510042851999834}
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY:-}
      DISCORD_VIDEO_CHANNEL: ${DISCORD_VIDEO_CHANNEL:-1560771030228799510}
      DISCORD_ROLE_VIDEO_PING: ${DISCORD_ROLE_VIDEO_PING:-}
      DISCORD_EGG_CHANNEL: ${DISCORD_EGG_CHANNEL:-1567675436681662604}
      DISCORD_ROLE_EGG_PING: ${DISCORD_ROLE_EGG_PING:-1567693893963612250}
      DISCORD_EGG_LANG: ${DISCORD_EGG_LANG:-es}
      ROBLOX_API_KEY: ${ROBLOX_API_KEY:-}
      MEDIA_DIR: ${MEDIA_DIR:-/data/media}
      DISCORD_ROLE_HELPER: ${DISCORD_ROLE_HELPER:-1563735797444771961}
      DISCORD_ROLE_MODERATORJR: ${DISCORD_ROLE_MODERATORJR:-1563736116300087337}
      DISCORD_ROLE_STAFF_MODERATOR: ${DISCORD_ROLE_STAFF_MODERATOR:-1563736465522036736}
      STAFF_LINK_DEADLINE: ${STAFF_LINK_DEADLINE:-2026-12-01}
      STAFF_FAIL_MONTHS_TO_REMOVE: ${STAFF_FAIL_MONTHS_TO_REMOVE:-2}
      STAFF_WARN_DAY: ${STAFF_WARN_DAY:-20}
      STAFF_GRACE_DAYS: ${STAFF_GRACE_DAYS:-3}
      # Vistas automáticas (YouTube sin claves; TikTok/Twitch/Kick con yt-dlp). YOUTUBE_API_KEY es opcional
      VIEWS_AUTO: ${VIEWS_AUTO:-true}
      VIEWS_REFRESH_HOURS: ${VIEWS_REFRESH_HOURS:-6}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    volumes:
      - skyeggs-data:/data
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      - traefik.http.routers.skyeggs-api.rule=Host(`${DOMAIN:-skyeggs.pro}`) && PathPrefix(`/api/`)
      - traefik.http.routers.skyeggs-api.priority=100
      - traefik.http.routers.skyeggs-api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.skyeggs-api.tls=true
      - traefik.http.routers.skyeggs-api.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.skyeggs-api.loadbalancer.server.port=8080

volumes:
  skyeggs-data:

networks:
  traefik:
    name: ${TRAEFIK_NETWORK:-traefik}
    external: true
